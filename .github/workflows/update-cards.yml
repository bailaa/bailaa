name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== Карточка 1: Stats (без stargazers, чтобы не было ошибки 403) =====
      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_TOKEN }}
          user: bailaa
          filename: profile/stats.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Europe/Moscow
          committer_message: "metrics: refresh stats card"

      # ===== Карточка 2: Top Languages (отдельный файл) =====
      - name: Generate top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PAT_TOKEN }}
          user: bailaa
          filename: profile/top-langs.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_categories: markup, programming
          committer_message: "metrics: refresh top-langs card"

      # ===== Коммит обеих карточек =====
      - name: Commit generated cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update README cards" || exit 0
          git push
