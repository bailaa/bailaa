name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # Запуск каждый день в 3:00 UTC
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает право коммитить изменения
    steps:
      - uses: actions/checkout@v4

      # Генерация карточки со статистикой
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radical
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Генерация карточки с языками
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Коммит и пуш сгенерированных файлов
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
